<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>NIGHTSHIFT — Tactical 5v5 Control Points</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  :root { --ch-gap: 5px; }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 100%; height: 100%; overflow: hidden; background: #070b12; font-family: 'Segoe UI', system-ui, sans-serif; }
  #app, #app canvas { width: 100%; height: 100%; display: block; }
  #hud { position: fixed; inset: 0; pointer-events: none; color: #fff; user-select: none; }
  #crosshair { position: absolute; left: 50%; top: 50%; width: 0; height: 0; }
  .ch-dot { position: absolute; left: -1.5px; top: -1.5px; width: 3px; height: 3px; background: #fff; border-radius: 50%; }
  .ch-line { position: absolute; background: #fff; }
  .ch-t { left: -1px; top: calc(-1 * var(--ch-gap) - 7px); width: 2px; height: 7px; }
  .ch-b { left: -1px; top: var(--ch-gap); width: 2px; height: 7px; }
  .ch-l { left: calc(-1 * var(--ch-gap) - 7px); top: -1px; width: 7px; height: 2px; }
  .ch-r { left: var(--ch-gap); top: -1px; width: 7px; height: 2px; }
  #hitdir { position: absolute; left: 50%; top: 50%; width: 120px; height: 120px; margin: -60px 0 0 -60px; border: 3px solid transparent; border-top-color: #ff5533; border-radius: 50%; opacity: 0; transition: opacity 0.15s; }
  #hitdir.show { opacity: 0.9; }
  #flash-overlay { position: absolute; inset: 0; background: #fff; opacity: 0; }
  #damage-vignette { position: absolute; inset: 0; background: radial-gradient(ellipse at center, transparent 55%, rgba(255, 30, 30, 0.55) 100%); opacity: 0; }
  #damage-vignette.show { animation: dmg 0.6s ease-out; }
  @keyframes dmg { 0% { opacity: 1; } 100% { opacity: 0; } }
  #topbar { position: absolute; top: 14px; left: 50%; transform: translateX(-50%); display: flex; gap: 18px; font-size: 20px; font-weight: 700; letter-spacing: 1px; text-shadow: 0 1px 3px #000; }
  #score-ember { color: #ff7a1a; }
  #score-alloy { color: #2ec4b6; }
  #point-strip { position: absolute; top: 46px; left: 50%; transform: translateX(-50%); display: flex; gap: 10px; }
  .pt { display: inline-block; position: relative; width: 52px; padding: 3px 0; text-align: center; font-size: 15px; font-weight: 800; border-radius: 4px; overflow: hidden; background: #1a2230; color: #cfd6e4; border: 1px solid #3a4658; }
  .pt i { position: absolute; left: 0; bottom: 0; height: 3px; background: #fff; display: block; }
  .pt-e { background: #ff7a1a; color: #1a0d00; border-color: #ff7a1a; }
  .pt-a { background: #2ec4b6; color: #00211e; border-color: #2ec4b6; }
  .pt-n { background: #1a2230; color: #cfd6e4; }
  #round-history { position: absolute; top: 82px; left: 50%; transform: translateX(-50%); display: flex; gap: 6px; }
  .rh { display: inline-block; width: 20px; height: 20px; line-height: 20px; text-align: center; font-size: 12px; font-weight: 800; border-radius: 3px; background: #1a2230; color: #8a97a8; border: 1px solid #3a4658; }
  .rh-e { background: #ff7a1a; color: #1a0d00; border-color: #ff7a1a; }
  .rh-a { background: #2ec4b6; color: #00211e; border-color: #2ec4b6; }
  #phase { position: absolute; top: 110px; left: 50%; transform: translateX(-50%); font-size: 13px; letter-spacing: 2px; color: #c9d2de; text-shadow: 0 1px 3px #000; }
  #message { position: absolute; top: 24%; left: 50%; transform: translateX(-50%); font-size: 22px; font-weight: 700; text-shadow: 0 2px 6px #000; opacity: 0; transition: opacity 0.3s; text-align: center; white-space: nowrap; }
  #message.show { opacity: 1; }
  #minimap-wrap { position: absolute; left: 16px; top: 16px; border: 1px solid #3a4658; border-radius: 4px; overflow: hidden; }
  #stats { position: absolute; right: 20px; bottom: 18px; text-align: right; text-shadow: 0 1px 3px #000; }
  #health { font-size: 44px; font-weight: 800; line-height: 1; }
  #armor { font-size: 16px; color: #7fb4c7; }
  #armor::before { content: '🛡 '; }
  #money { font-size: 22px; color: #8fd18a; font-weight: 700; }
  #ammo { font-size: 26px; font-weight: 700; }
  #weapon-name { font-size: 13px; color: #c9d2de; }
  #grenades { font-size: 13px; margin-top: 4px; }
  .gren { color: #6a7686; margin-left: 8px; }
  .gren.has { color: #ffb347; }
  #killfeed { position: absolute; right: 20px; top: 16px; text-align: right; font-size: 13px; text-shadow: 0 1px 3px #000; }
  .kill-line { margin-bottom: 3px; }
  #buy-menu { position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%); width: 520px; background: rgba(7, 11, 18, 0.92); border: 1px solid #3a4658; border-radius: 8px; padding: 18px 22px; pointer-events: auto; }
  #buy-menu h2 { font-size: 20px; margin-bottom: 12px; color: #ffb347; }
  .buy-section { margin-bottom: 10px; }
  .buy-item { display: flex; justify-content: space-between; align-items: center; width: 100%; padding: 8px 10px; margin-bottom: 4px; background: #141b28; color: #fff; border: 1px solid #2a3444; border-radius: 4px; cursor: pointer; font-size: 14px; }
  .buy-item:hover:not(:disabled) { border-color: #ffb347; }
  .buy-item:disabled { opacity: 0.4; cursor: default; }
  .buy-item.current { border-color: #2ec4b6; }
  .buy-name { font-weight: 700; width: 150px; text-align: left; }
  .buy-stat { color: #8a97a8; font-size: 12px; flex: 1; text-align: left; }
  .buy-price { color: #8fd18a; font-weight: 700; }
  .buy-hint { font-size: 12px; color: #8a97a8; text-align: center; margin-top: 8px; }
  #end-panel { position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%); background: rgba(7, 11, 18, 0.94); border: 1px solid #3a4658; border-radius: 8px; padding: 28px 40px; text-align: center; pointer-events: auto; }
  #end-panel h2 { font-size: 28px; margin-bottom: 12px; color: #ffb347; }
  #end-panel p { font-size: 16px; margin-bottom: 6px; }
  .hidden { display: none !important; }
</style>
</head>
<body>
<div id="app"></div>
<div id="hud"></div>
<style>
  #start-screen { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; background: radial-gradient(ellipse at 50% 35%, #16233a 0%, #070b12 70%); color: #fff; font-family: 'Segoe UI', system-ui, sans-serif; text-align: center; z-index: 10; }
  #start-screen h1 { font-size: 64px; letter-spacing: 8px; color: #ffb347; text-shadow: 0 0 30px rgba(255, 179, 71, 0.4); }
  #start-screen .tagline { font-size: 18px; letter-spacing: 3px; color: #2ec4b6; margin: 8px 0 20px; }
  #start-screen p { font-size: 16px; color: #c9d2de; max-width: 560px; line-height: 1.5; }
  #start-screen .controls { font-size: 13px; color: #8a97a8; margin-top: 14px; }
  #start-btn { margin-top: 28px; padding: 14px 48px; font-size: 20px; font-weight: 700; letter-spacing: 2px; color: #1a0d00; background: #ffb347; border: none; border-radius: 6px; cursor: pointer; }
  #start-btn:hover { background: #ffc46b; }
</style>

</html>
